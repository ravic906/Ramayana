name: Android build

# Builds a debug APK on every push and publishes it to the rolling
# "android-dev" pre-release so it can be downloaded straight to a phone.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Install Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          wget -q "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -o -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$T"
          rm /tmp/templates.tpz

      - name: Configure Godot for Android
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          mkdir -p ~/.local/share/godot/keystores ~/.config/godot
          keytool -genkeypair -v -keystore ~/.local/share/godot/keystores/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import project
        run: godot --headless --import

      - name: Run tests
        run: godot --headless -s res://tests/run_tests.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/ramayana-debug.apk
          test -s build/ramayana-debug.apk
          ls -lh build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramayana-debug-apk
          path: build/ramayana-debug.apk

      - name: Publish to android-dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Debug build from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Download ramayana-debug.apk on your Android phone and open it to install."
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev build/ramayana-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android dev build (${GITHUB_SHA::7})" --notes "$NOTES"
